name: Deploy Streak Stats to GitHub Pages

on:
  schedule:
    # Run every 6 hours to keep streak and contribution stats updated
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, curl
          coverage: none

      - name: Install Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Create Build Directory
        run: mkdir -p build

      - name: Generate Streak Cards
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Flagship Microsoft Dark Theme (Insane Flame Edition) - Default streak.svg
          php bin/generate-card.php --options="user=xploitoverload&theme=microsoft-dark&starting_year=2018" --path="build/streak.svg"
          
          # 2. Microsoft Dark Theme (Explicit endpoint)
          php bin/generate-card.php --options="user=xploitoverload&theme=microsoft-dark&starting_year=2018" --path="build/streak-microsoft-dark.svg"

          # 3. Custom CX330 The Star Tactical Red/Black Theme
          php bin/generate-card.php --options="user=xploitoverload&starting_year=2018&background=0a0a0a&border=e50914&stroke=e50914&ring=e50914&fire=e50914&currStreakNum=ffffff&sideNums=ffffff&currStreakLabel=e50914&sideLabels=cccccc&dates=888888" --path="build/streak-cx330.svg"

          # 4. Dark Theme
          php bin/generate-card.php --options="user=xploitoverload&theme=dark&starting_year=2018" --path="build/streak-dark.svg"
          
          # 5. Radical Theme
          php bin/generate-card.php --options="user=xploitoverload&theme=radical&starting_year=2018" --path="build/streak-radical.svg"

          # 6. Self-Hosted Microsoft Dark Activity Graph (31 Days)
          php bin/generate-activity-graph.php --user="xploitoverload" --days=31 --path="build/activity-graph.svg"

          # 7. Self-Hosted GitHub Dashboard (Telemetry & Activity Chart)
          php bin/generate-dashboard.php --user="xploitoverload" --path="build/dashboard.svg"

      - name: Generate Landing Page
        run: |
          cat << 'EOF' > build/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Kalpesh Solanki | GitHub Streak Stats & Telemetry</title>
            <style>
              body {
                background-color: #05070a;
                color: #c9d1d9;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                margin: 0;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
              }
              h1 { color: #f25022; margin-bottom: 8px; font-size: 30px; letter-spacing: -0.5px; }
              p.subtitle { color: #8b949e; margin-top: 0; margin-bottom: 30px; text-align: center; }
              .badge {
                display: inline-block;
                background: linear-gradient(135deg, #f25022, #ffb900);
                color: #000;
                font-weight: 700;
                font-size: 11px;
                padding: 3px 8px;
                border-radius: 12px;
                margin-left: 8px;
                vertical-align: middle;
                letter-spacing: 0.5px;
              }
              .card-container {
                display: flex;
                flex-direction: column;
                gap: 28px;
                max-width: 900px;
                width: 100%;
                align-items: center;
              }
              .card-box {
                background: #0d1117;
                border: 1px solid #21262d;
                border-radius: 10px;
                padding: 22px;
                width: 100%;
                box-sizing: border-box;
                text-align: center;
                transition: transform 0.2s, border-color 0.2s;
              }
              .card-box:hover {
                border-color: #388bfd;
                transform: translateY(-2px);
              }
              .card-box.featured {
                border: 1px solid #f25022;
                box-shadow: 0 0 25px rgba(242, 80, 34, 0.15);
              }
              .card-box h3 { margin-top: 0; color: #58a6ff; font-size: 19px; }
              img.streak-card { max-width: 100%; height: auto; border-radius: 6px; }
              .code-block {
                margin-top: 15px;
                background: #000000;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 12px;
                font-family: monospace;
                font-size: 13px;
                color: #7ee787;
                overflow-x: auto;
                text-align: left;
                word-break: break-all;
              }
            </style>
          </head>
          <body>
            <h1>Kalpesh Solanki (CX330) System Telemetry</h1>
            <p class="subtitle">Autonomous GitHub Readme Streak Stats &bull; Multi-Layer Flame &bull; Self-Hosted Activity Graph</p>
            
            <div class="card-container">
              <div class="card-box featured">
                <h3>[0x00] GitHub System Dashboard <span class="badge">SELF-HOSTED PLATFORM</span></h3>
                <img class="streak-card" src="dashboard.svg" alt="GitHub System Dashboard">
                <div class="code-block">[![GitHub Dashboard](https://xploitoverload.github.io/github-readme-streak-stats/dashboard.svg)](https://github.com/xploitoverload)</div>
              </div>

              <div class="card-box featured">
                <h3>[0x01] Microsoft Dark <span class="badge">INSANE FIRE EDITION</span></h3>
                <img class="streak-card" src="streak-microsoft-dark.svg" alt="Microsoft Dark Streak Stats">
                <div class="code-block">[![Microsoft Dark Streak](https://xploitoverload.github.io/github-readme-streak-stats/streak-microsoft-dark.svg)](https://github.com/xploitoverload)</div>
              </div>

              <div class="card-box featured">
                <h3>[0x02] Autonomous Activity Graph <span class="badge">SELF-HOSTED NEON GRAPH</span></h3>
                <img class="streak-card" src="activity-graph.svg" alt="Autonomous Contribution Activity Graph">
                <div class="code-block">[![Contribution Graph](https://xploitoverload.github.io/github-readme-streak-stats/activity-graph.svg)](https://github.com/xploitoverload)</div>
              </div>

              <div class="card-box">
                <h3>[0x03] CX330 Custom Tactical Red/Black</h3>
                <img class="streak-card" src="streak-cx330.svg" alt="CX330 Streak Stats">
                <div class="code-block">[![CX330 Streak Stats](https://xploitoverload.github.io/github-readme-streak-stats/streak-cx330.svg)](https://github.com/xploitoverload)</div>
              </div>

              <div class="card-box">
                <h3>[0x04] Dark Theme</h3>
                <img class="streak-card" src="streak-dark.svg" alt="Dark Streak Stats">
                <div class="code-block">[![Dark Streak Stats](https://xploitoverload.github.io/github-readme-streak-stats/streak-dark.svg)](https://github.com/xploitoverload)</div>
              </div>

              <div class="card-box">
                <h3>[0x05] Radical Theme</h3>
                <img class="streak-card" src="streak-radical.svg" alt="Radical Streak Stats">
                <div class="code-block">[![Radical Streak Stats](https://xploitoverload.github.io/github-readme-streak-stats/streak-radical.svg)](https://github.com/xploitoverload)</div>
              </div>

              <div class="card-box">
                <h3>[0x06] Default Endpoint (streak.svg)</h3>
                <img class="streak-card" src="streak.svg" alt="Default Streak Stats">
                <div class="code-block">[![Streak Stats](https://xploitoverload.github.io/github-readme-streak-stats/streak.svg)](https://github.com/xploitoverload)</div>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

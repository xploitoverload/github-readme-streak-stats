<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Hill - GT350 // CX330 Audio Protocol</title>
  <link rel="icon" href="https://github.githubassets.com/favicons/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05070a;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fira Code", monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(229, 9, 20, 0.22) 0%, transparent 65%),
        radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        linear-gradient(to bottom, #05070a 0%, #0a0e17 100%);
    }

    .terminal-container {
      width: 100%;
      max-width: 640px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 14px;
      box-shadow: 0 0 45px rgba(229, 9, 20, 0.25), 0 25px 60px rgba(0,0,0,0.85);
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .terminal-header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .terminal-title {
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      font-family: monospace;
      letter-spacing: 0.5px;
    }
    .terminal-title span {
      color: #e50914;
    }

    .terminal-body {
      padding: 32px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .track-tag {
      display: inline-block;
      background: rgba(229, 9, 20, 0.15);
      color: #e50914;
      border: 1px solid rgba(229, 9, 20, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .track-name {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(229, 9, 20, 0.6);
    }

    .artist-name {
      font-size: 15px;
      color: #8b949e;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .artist-name strong {
      color: #00f0ff;
    }

    /* Equalizer Visualizer */
    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 52px;
      margin-bottom: 24px;
      padding: 0 10px;
    }

    .eq-bar {
      width: 7px;
      background: linear-gradient(to top, #e50914, #ff5f56);
      border-radius: 4px 4px 0 0;
      height: 12px;
      animation: eqDance 0.8s infinite ease-in-out alternate;
    }

    .eq-bar:nth-child(2n) { animation-duration: 0.6s; background: linear-gradient(to top, #e50914, #ffb900); }
    .eq-bar:nth-child(3n) { animation-duration: 1.1s; background: linear-gradient(to top, #00f0ff, #58a6ff); }
    .eq-bar:nth-child(4n) { animation-duration: 0.7s; }
    .eq-bar:nth-child(5n) { animation-duration: 0.9s; }
    .eq-bar:nth-child(6n) { animation-duration: 1.2s; background: linear-gradient(to top, #39d353, #00f0ff); }

    @keyframes eqDance {
      0% { height: 8px; }
      100% { height: 48px; }
    }

    /* Player Controls */
    .controls-panel {
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 22px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      background: #e50914;
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s linear;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.8);
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #8b949e;
      font-family: monospace;
    }

    .playback-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .play-btn {
      min-width: 130px;
      height: 44px;
      border-radius: 8px;
      background: #e50914;
      border: none;
      color: white;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
    }
    .play-btn:hover {
      background: #b80710;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(229, 9, 20, 0.7);
    }

    .vol-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #8b949e;
      font-family: monospace;
    }
    .vol-slider {
      width: 100px;
      accent-color: #e50914;
      cursor: pointer;
    }

    .controls-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: monospace;
    }

    .btn-primary {
      background: #238636;
      color: #ffffff;
      border: 1px solid #2ea043;
    }
    .btn-primary:hover {
      background: #2ea043;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(46, 160, 67, 0.4);
    }

    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    .btn-secondary:hover {
      background: #30363d;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .footer-status {
      margin-top: 20px;
      font-size: 12px;
      color: #484f58;
      font-family: monospace;
      text-align: center;
    }
    .footer-status span {
      color: #39d353;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="terminal-header">
      <div class="window-dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="terminal-title">xploitoverload@cx330:~# <span>./play_audio --track="GT350"</span></div>
      <div style="width: 48px;"></div>
    </div>

    <div class="terminal-body">
      <div class="track-tag">High Octane System Audio</div>
      <h1 class="track-name">GT350</h1>
      <div class="artist-name">Artist: <strong>Jake Hill</strong> &bull; V8 Shelby Redline Protocol</div>

      <!-- Equalizer Visualizer -->
      <div class="visualizer" id="visualizer">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>

      <!-- Native HTML5 Audio with immediate autoplay -->
      <audio id="audioPlayer" src="gt350.mp3" autoplay preload="auto" loop></audio>

      <!-- Player Controls -->
      <div class="controls-panel">
        <div class="progress-bar-container" id="progressContainer" onclick="seek(event)">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-info">
          <span id="currTime">0:00</span>
          <span id="durTime">2:32</span>
        </div>

        <div class="playback-row">
          <button class="play-btn" id="playBtn" onclick="togglePlay()">
            <span id="playIcon">❚❚</span>
            <span id="playLabel">PAUSE</span>
          </button>
          
          <div class="vol-control">
            <span id="volIcon">🔊</span>
            <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="0.95" oninput="setVol(this.value)">
            <span id="volVal">95%</span>
          </div>
        </div>
      </div>

      <div class="controls-footer">
        <a href="https://github.com/xploitoverload" class="btn btn-primary">
          <span>⏎</span> Return to GitHub Profile
        </a>
        <a href="https://open.spotify.com/search/Jake%20Hill%20GT350" target="_blank" class="btn btn-secondary">
          <span>♫</span> Spotify
        </a>
      </div>

      <div class="footer-status">
        [RING_0_AUDIO_STREAM] &bull; STATUS: <span id="statusText">PLAYING // 8250 RPM</span>
      </div>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playLabel = document.getElementById('playLabel');
    const progressBar = document.getElementById('progressBar');
    const currTime = document.getElementById('currTime');
    const durTime = document.getElementById('durTime');
    const statusText = document.getElementById('statusText');
    const volVal = document.getElementById('volVal');
    const volIcon = document.getElementById('volIcon');

    audio.volume = 0.95;

    function formatTime(s) {
      if (isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function updatePlayState(playing) {
      if (playing) {
        playIcon.textContent = '❚❚';
        playLabel.textContent = 'PAUSE';
        statusText.innerHTML = 'PLAYING // 8250 RPM';
      } else {
        playIcon.textContent = '▶';
        playLabel.textContent = 'PLAY';
        statusText.innerHTML = 'PAUSED';
      }
    }

    function doPlay() {
      if (!audio.paused) return;
      audio.play().then(() => {
        updatePlayState(true);
      }).catch(e => {
        // Continue attempting on buffer ready
      });
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => updatePlayState(true));
      } else {
        audio.pause();
        updatePlayState(false);
      }
    }

    function setVol(val) {
      audio.volume = val;
      const pct = Math.round(val * 100);
      volVal.textContent = pct + '%';
      if (pct === 0) volIcon.textContent = '🔇';
      else if (pct < 50) volIcon.textContent = '🔉';
      else volIcon.textContent = '🔊';
    }

    audio.addEventListener('play', () => updatePlayState(true));
    audio.addEventListener('pause', () => updatePlayState(false));

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = percent + '%';
        currTime.textContent = formatTime(audio.currentTime);
        durTime.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durTime.textContent = formatTime(audio.duration);
      doPlay();
    });

    audio.addEventListener('canplay', doPlay);
    audio.addEventListener('canplaythrough', doPlay);

    function seek(e) {
      const container = document.getElementById('progressContainer');
      const rect = container.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      audio.currentTime = (clickX / width) * audio.duration;
    }

    // Force play on every lifecycle trigger
    doPlay();
    document.addEventListener('DOMContentLoaded', doPlay);
    window.addEventListener('load', doPlay);

    // Visibility / Focus triggers
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) doPlay();
    });
    window.addEventListener('focus', doPlay);
    window.addEventListener('pageshow', doPlay);

    // Global interaction fallback (single touch / mousemove / scroll fires it instantly)
    ['pointerdown', 'mousedown', 'keydown', 'touchstart', 'scroll', 'mousemove'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (audio.paused) doPlay();
      }, { once: false, passive: true });
    });

    // Persistent loop until audio is actively running
    const keepPlaying = setInterval(() => {
      if (!audio.paused) {
        clearInterval(keepPlaying);
      } else {
        doPlay();
      }
    }, 150);
  </script>
</body>
</html>

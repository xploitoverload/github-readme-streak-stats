<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Hill - GT350 // CX330 Audio Protocol</title>
  <link rel="icon" href="https://github.githubassets.com/favicons/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07090e;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fira Code", monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(229, 9, 20, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.05) 0%, transparent 50%);
    }

    .terminal-container {
      width: 100%;
      max-width: 780px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(229, 9, 20, 0.25), 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .terminal-header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .terminal-title {
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      letter-spacing: 0.5px;
      font-family: monospace;
    }

    .terminal-title span {
      color: #e50914;
    }

    .terminal-body {
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .track-meta {
      text-align: center;
      margin-bottom: 24px;
    }

    .track-tag {
      display: inline-block;
      background: rgba(229, 9, 20, 0.15);
      color: #e50914;
      border: 1px solid rgba(229, 9, 20, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .track-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .artist-name {
      font-size: 16px;
      color: #8b949e;
      font-weight: 500;
    }

    .artist-name strong {
      color: #00f0ff;
    }

    /* Equalizer Visualizer */
    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 48px;
      margin-bottom: 24px;
    }

    .eq-bar {
      width: 6px;
      background: linear-gradient(to top, #e50914, #ff5f56);
      border-radius: 3px 3px 0 0;
      animation: eqBounce 1.2s infinite ease-in-out;
    }

    .eq-bar:nth-child(2n) { animation-duration: 0.9s; background: linear-gradient(to top, #e50914, #ffb900); }
    .eq-bar:nth-child(3n) { animation-duration: 1.4s; background: linear-gradient(to top, #00f0ff, #58a6ff); }
    .eq-bar:nth-child(4n) { animation-duration: 0.8s; }
    .eq-bar:nth-child(5n) { animation-duration: 1.1s; }

    @keyframes eqBounce {
      0%, 100% { height: 8px; }
      50% { height: 46px; }
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #30363d;
      background: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .controls-footer {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: monospace;
    }

    .btn-primary {
      background: #e50914;
      color: #ffffff;
      border: 1px solid #e50914;
    }
    .btn-primary:hover {
      background: #b80710;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
    }

    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    .btn-secondary:hover {
      background: #30363d;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .footer-status {
      margin-top: 24px;
      font-size: 12px;
      color: #484f58;
      font-family: monospace;
      text-align: center;
    }
    .footer-status span {
      color: #39d353;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="terminal-header">
      <div class="window-dots">
        <div class="dot red"></div>

      </div>
      <div class="terminal-title">xploitoverload@cx330:~# <span>./play_audio --track="GT350"</span></div>
      <div style="width: 48px;"></div>

    <div class="terminal-body">
      <div class="track-meta">

        <div class="artist-name">Artist: <strong>Jake Hill</strong> &bull; V8 Shelby Redline Protocol</div>
      </div>

      <div class="visualizer">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>

      <div class="player-wrapper">
        <iframe 
          src="https://www.youtube.com/embed/zzIKp5CHn-0?autoplay=1&rel=0&modestbranding=1" 
          title="Jake Hill - GT350" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>

      <div class="controls-footer">
        <a href="https://github.com/xploitoverload" class="btn btn-primary">
          <span>⏎</span> Return to GitHub Profile
        </a>
        <a href="https://open.spotify.com/search/Jake%20Hill%20GT350" target="_blank" class="btn btn-secondary">
          <span>♫</span> Open on Spotify
        </a>
      </div>

      <div class="footer-status">
        [RING_0_AUDIO_STREAM] &bull; STATUS: <span>CONNECTED // 8250 RPM</span>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Hill - GT350 // Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05070a;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px 24px;
      max-width: 500px;
      box-shadow: 0 0 35px rgba(229, 9, 20, 0.4);
    }
    h2 {
      color: #e50914;
      font-size: 24px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    p {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .btn {
      background: #e50914;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.6);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #b80710;

<body onclick="launch()">

  <div class="card">
    <h2>⚡ LAUNCHING GT350...</h2>
    <p>Opening player in a centered window... Click anywhere if blocked by browser.</p>
    <a href="#" onclick="launch(); return false;" class="btn">▶ OPEN WINDOW NOW</a>
  </div>

  <script>
    const url = "https://www.youtube.com/watch?v=zzIKp5CHn-0";

    function openCenteredWindow(url) {
      const width = 800;
      const height = 600;
      const left = (window.screen.width - width) / 2;
      const top = (window.screen.height - height) / 2;

      const features = `width=${width},height=${height},left=${left},top=${top},scrollbars=yes,resizable=yes,noopener,noreferrer`;
      return window.open(url, 'perfectWindow', features);
    }

    function launch() {
      const win = openCenteredWindow(url);
      // After launching the window, return this tab back to GitHub profile!
      setTimeout(function() {
        window.location.replace("https://github.com/xploitoverload");
      }, 500);
      return win;
    }

    // Open immediately when page loads!
    window.addEventListener('load', function() {
      launch();
    });
    document.addEventListener('DOMContentLoaded', function() {
      launch();
    });
    launch();
  </script>
</body>

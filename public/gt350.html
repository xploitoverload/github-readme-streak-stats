<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Hill - GT350 // Player Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05070a;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fira Code", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(229, 9, 20, 0.25) 0%, transparent 65%),
        linear-gradient(to bottom, #05070a 0%, #0a0e17 100%);
    }
    .card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 36px 28px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 0 45px rgba(229, 9, 20, 0.3), 0 20px 50px rgba(0,0,0,0.8);
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-block;
      background: rgba(229, 9, 20, 0.15);
      color: #e50914;
      border: 1px solid rgba(229, 9, 20, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
    }
    .subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .subtitle strong {
      color: #00f0ff;
    }
    .btn-launch {
      background: linear-gradient(135deg, #e50914 0%, #b80710 100%);
      color: #ffffff;
      padding: 16px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.6), 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      cursor: pointer;
      text-transform: uppercase;
      animation: pulseGlow 1.8s infinite alternate;
      margin-bottom: 24px;
    }
    .btn-launch:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 35px rgba(229, 9, 20, 0.9);
      background: linear-gradient(135deg, #ff1a26 0%, #e50914 100%);
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(229, 9, 20, 0.4); }
      100% { box-shadow: 0 0 30px rgba(229, 9, 20, 0.85); }
    }
    .return-link {
      display: inline-block;
      color: #8b949e;
      font-size: 13px;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #30363d;
      transition: all 0.2s;
    }
    .return-link:hover {
      color: #ffffff;
      border-color: #8b949e;
      background: #161b22;
    }
    .hint {
      color: #484f58;
      font-size: 11px;
      margin-top: 14px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">SYSTEM AUDIO PROTOCOL</div>
    <h1>GT350</h1>
    <div class="subtitle">Artist: <strong>Jake Hill</strong> &bull; V8 Shelby Redline</div>

    <div>
      <a href="https://www.youtube.com/watch?v=zzIKp5CHn-0&autoplay=1" 
         onclick="openCenteredWindow(this.href); return false;" 
         class="btn-launch" id="launchBtn">
        <span>⚡</span> Open Perfect New Window
      </a>
    </div>

    <div>
      <a href="https://github.com/xploitoverload" class="return-link">
        ⏎ Return to GitHub Profile
      </a>
    </div>

    <div class="hint">
      [POPUP_WINDOW: 800x600 CENTERED] &bull; AUTO-LAUNCHING...
    </div>
  </div>

  <script>
    const youtubeUrl = "https://www.youtube.com/watch?v=zzIKp5CHn-0&autoplay=1";
    let popupWin = null;

    function openCenteredWindow(url) {
      // If already open and active, just bring to front
      if (popupWin && !popupWin.closed) {
        popupWin.focus();
        return popupWin;
      }

      const width = 800;
      const height = 600;
      const left = Math.max(0, Math.round((window.screen.width - width) / 2));
      const top = Math.max(0, Math.round((window.screen.height - height) / 2));

      // Removed 'noopener' so the browser can reuse the named 'perfectWindow'
      const features = `width=${width},height=${height},left=${left},top=${top},scrollbars=yes,resizable=yes`;
      popupWin = window.open(url, 'perfectWindow', features);

      // Keep this profile/parent window on TOP!
      if (popupWin) {
        try { popupWin.blur(); } catch(e) {}
        window.focus();

        [50, 150, 300, 600].forEach(delay => {
          setTimeout(() => {
            try { popupWin.blur(); } catch(e) {}
            window.focus();
          }, delay);
        });
      }

      return popupWin;
    }

    // Run exactly ONCE on page load
    let autoLaunched = false;
    function tryAutoLaunch() {
      if (autoLaunched) return;
      autoLaunched = true;
      openCenteredWindow(youtubeUrl);
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      tryAutoLaunch();
    } else {
      document.addEventListener('DOMContentLoaded', tryAutoLaunch, { once: true });
    }
  </script>
</body>
</html>
